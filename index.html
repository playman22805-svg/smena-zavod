<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена: Выжить на заводе</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем рекламную сеть Adsgram для WebApp -->
    <script src="https://sad.adsgram.ai/js/adsgram.min.js"></script>
</head>
<body>
    <div class="game-container">
        <!-- Шапка: День и Время -->
        <header id="header-shift">
            <h1 id="shift-title">🌞 День 1 | Время: 07:00</h1>
        </header>

        <!-- Шкалы параметров -->
        <div class="stats-panel">
            <div class="stat-bar">
                <span>🪫 Энергия:</span>
                <div class="bar"><div id="energy-fill" class="fill" style="width: 100%;"></div></div>
            </div>
            <div class="stat-bar">
                <span>🧠 Стресс:</span>
                <div class="bar"><div id="stress-fill" class="fill stress" style="width: 10%;"></div></div>
            </div>
            <div class="stat-bar">
                <span>💰 Деньги:</span>
                <div class="bar"><div id="money-fill" class="fill money" style="width: 15%;"></div></div>
            </div>
        </div>

        <!-- Основная игровая карточка -->
        <div class="card" id="game-card">
            <div id="event-text">Загрузка смены на заводе...</div>
            <div class="choices" id="choices-container">
                <!-- Кнопки генерируются скриптом -->
            </div>
        </div>

        <!-- Экран поражения -->
        <div id="game-over-screen" class="hidden">
            <h2 id="end-title">Смена окончена</h2>
            <p id="end-desc">Описание результата...</p>
            <button onclick="restartGame()">Начать смену заново</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
